apiVersion: v1
kind: Service
metadata:
  name: factorio-rcon
  namespace: factorio
spec:
  selector:
    app: factorio
  ports:
    - name: rcon
      port: 27015
      targetPort: 27015
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-bridge
  namespace: factorio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-bridge
  namespace: factorio
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]   # patch: /update command does a rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-bridge
  namespace: factorio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factorio-bridge
subjects:
  - kind: ServiceAccount
    name: factorio-bridge
    namespace: factorio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: factorio-bridge-config
  namespace: factorio
data:
  # Discord channel the bot alerts in and listens to (Dev Mode -> Copy ID).
  # "0" keeps the bridge in headless mode (alerts to logs only).
  DISCORD_CHANNEL_ID: "1283531892259426355"
  POLL_INTERVAL_S: "10"
  QUIET_GAP_S: "120"
  WAVE_ALERT_THRESHOLD: "25"
  AUTO_PAUSE_ON_BREACH: "true"
  ALERT_JOINS: "false"
  # Mirror of the game's auto_pause setting — flip BOTH at the 24/7 switch.
  GAME_AUTO_PAUSE: "false"
  # Tapped-resource alerts: scan cadence, alert fraction of peak, min patch size.
  RESOURCE_POLL_S: "300"
  RESOURCE_ALERT_PCT: "0.20"
  RESOURCE_MIN_PEAK: "10000"
  DIGEST_HOUR_UTC: "15"   # 8am Pacific
  # Losses of these are "normal combat" (waves). Anything else destroyed by
  # the enemy force is a breach. Append DLC turret types here at the Space
  # Age flip (unknown names alarm rather than stay silent, by design).
  DEFENSE_ENTITIES: "stone-wall,gate,gun-turret,laser-turret,flamethrower-turret,artillery-turret,radar,land-mine,defender,distractor,destroyer"
  IGNORED_ENTITIES: "cliff,fish"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-bridge
  namespace: factorio
  labels:
    app: factorio-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate            # mounts the RWO game volume
  selector:
    matchLabels:
      app: factorio-bridge
  template:
    metadata:
      labels:
        app: factorio-bridge
    spec:
      serviceAccountName: factorio-bridge
      # Same pinning as the game: both PVCs are RWO block storage attached to
      # the games node.
      tolerations:
        - key: dedicated
          operator: Equal
          value: terraria
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["g6-standard-6"]
      securityContext:
        fsGroup: 845
      containers:
        - name: bridge
          image: bholcombe/factorio-bridge:16
          envFrom:
            - configMapRef:
                name: factorio-bridge-config
          env:
            - name: RCON_HOST
              value: "factorio-rcon"
            - name: RCON_PORT
              value: "27015"
            - name: RCONPW
              valueFrom:
                secretKeyRef:
                  name: factorio-secrets
                  key: RCONPW
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: factorio-secrets
                  key: DISCORD_BOT_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          # The poll loop touches /tmp/heartbeat while iterating; a silent
          # hang (vs a crash, which exits on its own) gets the pod restarted.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - find /tmp/heartbeat -newermt '-90 seconds' | grep -q .
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: factorio-data
        - name: backups
          persistentVolumeClaim:
            claimName: factorio-backups
